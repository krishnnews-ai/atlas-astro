backend:
  name: github
  repo: username/repo-name  # Yahan apna GitHub username aur repo ka naam dalo
  branch: main              # Agar aapka default branch 'master' hai toh master likho

media_folder: "public/images" # Jab aap CMS se photo upload karoge toh kahan save hogi
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog" # Aapke blog posts ki location
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "pubDate", widget: "datetime" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
