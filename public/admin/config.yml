backend:
  name: github
  repo: krishnnews-ai/atlas-astro
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "Target keyword ko title ke shuru me rakhein (50-60 chars)" }
      - { label: "URL Slug", name: "slug", widget: "string", required: false, hint: "Custom URL link (e.g. bitcoin-news-today)" }
      - { label: "Draft Post", name: "draft", widget: "boolean", default: false, hint: "On karne par post site par hide rahegi" }
      - { label: "Publish Date", name: "pubDate", widget: "datetime" }
      - { label: "Updated Date", name: "updatedDate", widget: "datetime", required: false, hint: "Post update karne par date badlein (Google Freshness)" }
      - { label: "Author Name", name: "author", widget: "string", default: "Coin AI News Team", hint: "Google E-E-A-T ranking ke liye" }
      - label: "Category"
        name: "category"
        widget: "select"
        default: "Bitcoin News"
        options:
          - "Crypto Regulations"
          - "Market News"
          - "Wallet"
          - "Bitcoin News"
          - "Altcoin News"
          - "Editor's Choice"
          - "Ethereum News"
          - "Stablecoin"
      - { label: "Keywords / Tags", name: "tags", widget: "list", required: false, hint: "Relevant keywords comma se alag karein" }
      - { label: "Meta Description", name: "description", widget: "text", hint: "150-160 characters ka summary (CTR badhane ke liye)" }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Image Alt Text", name: "imageAlt", widget: "string", required: false, hint: "SEO image description" }
      - { label: "Canonical URL", name: "canonicalURL", widget: "string", required: false, hint: "Original source URL agar news kahin aur se li hai" }
      - { label: "Body", name: "body", widget: "markdown" }
