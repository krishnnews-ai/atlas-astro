backend:
  name: github
  repo: krishnnews-ai/atlas-astro
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "yaml-frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "URL Slug", name: "slug", widget: "string", required: false }
      - { label: "Draft Post", name: "draft", widget: "boolean", default: false }
      - { label: "Publish Date", name: "pubDate", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: "Author Name", name: "author", widget: "string", default: "Coin AI News Team" }
      - label: "Category"
        name: "category"
        widget: "select"
        default: "Bitcoin News"
        options:
          - "Crypto Regulations"
          - "Market News"
          - "Wallet"
          - "Bitcoin News"
          - "Altcoin News"
          - "Editor's Choice"
          - "Ethereum News"
          - "Stablecoin"
      - { label: "Keywords / Tags", name: "tags", widget: "list", required: false, default: [] }
      - { label: "Meta Description", name: "description", widget: "text", required: false }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Image Alt Text", name: "imageAlt", widget: "string", required: false }
      - { label: "Canonical URL", name: "canonicalURL", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
