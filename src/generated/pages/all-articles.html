<article class="atlas-post" data-slug="all-articles">
  <header class="atlas-post__header">
    <h1 class="atlas-post__title">All Articles</h1>
    <div class="atlas-post__meta">
      <span class="atlas-post__author">Top Crypto News</span>
      <time class="atlas-post__date" datetime="2026-09-28T14:07:14.856Z">2026-09-28T14:07:14.856Z</time>
    </div>
    <div class="atlas-post__categories">
      
    </div>
  </header>

  <div class="atlas-post__content">
<div id="archive-container">
  <p>Loading articles...</p>
</div>

<script>
(function() {
  var container = document.getElementById('archive-container');
  var allPosts = [];
  var startIndex = 1;
  var maxResults = 150;
  var totalFetched = 0;
  var totalPosts = 0;
  var maxPages = 10;

  function fetchPosts() {
    var url = '/feeds/posts/default?alt=json&start-index=' + startIndex + '&max-results=' + maxResults;

    fetch(url)
      .then(function(response) { return response.json(); })
      .then(function(data) {
        if (!data.feed.entry) {
          renderArchive();
          return;
        }

        totalPosts = parseInt(data.feed.openSearch$totalResults.$t, 10);
        totalFetched += data.feed.entry.length;

        data.feed.entry.forEach(function(post) {
          var postUrl = post.link.find(function(l) { return l.rel === 'alternate'; }).href;
          var title = post.title.$t;
          var date = new Date(post.published.$t).toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          });
          var labels = '';
          if (post.category) {
            labels = post.category.map(function(c) { return c.term; }).join(', ');
          }

          allPosts.push({
            title: title,
            url: postUrl,
            date: date,
            labels: labels
          });
        });

        startIndex += maxResults;

        if (totalFetched < totalPosts && startIndex <= (maxPages * maxResults)) {
          fetchPosts();
        } else {
          renderArchive();
        }
      })
      .catch(function(error) {
        console.log('Error:', error);
        renderArchive();
      });
  }

  function renderArchive() {
    if (allPosts.length === 0) {
      container.innerHTML = '<p>No articles found.</p>';
      return;
    }

    var html = '<p class="archive-count">Total articles: ' + allPosts.length + '</p>';
    html += '<ul class="archive-list">';

    allPosts.forEach(function(post) {
      html += '<li>';
      html += '<a href="' + post.url + '">' + post.title + '</a>';
      html += '<span class="archive-date">' + post.date + '</span>';
      if (post.labels) {
        html += '<span class="archive-labels">' + post.labels + '</span>';
      }
      html += '</li>';
    });

    html += '</ul>';
    container.innerHTML = html;
  }

  fetchPosts();
})();
</script>

<style>
#archive-container {
  padding: 20px 0;
}
.archive-count {
  font-size: 14px;
  color: #666;
  margin-bottom: 20px;
  padding-bottom: 10px;
  border-bottom: 2px solid #f0f0f0;
}
.archive-list {
  list-style: none;
  padding: 0;
  margin: 0;
}
.archive-list li {
  padding: 12px 0;
  border-bottom: 1px dashed #e0e0e0;
}
.archive-list li:last-child {
  border-bottom: none;
}
.archive-list a {
  display: block;
  font-size: 16px;
  font-weight: 600;
  color: #1f2328;
  text-decoration: none;
  line-height: 1.4;
  margin-bottom: 4px;
  transition: color 0.2s ease;
}
.archive-list a:hover {
  color: #1a73e8;
}
.archive-date {
  display: block;
  font-size: 12px;
  color: #888;
}
.archive-labels {
  display: block;
  font-size: 11px;
  color: #aaa;
  margin-top: 4px;
}
@media (max-width: 768px) {
  .archive-list a {
    font-size: 15px;
  }
}
</style>
