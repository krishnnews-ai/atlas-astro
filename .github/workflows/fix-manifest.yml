name: Fix Manifest
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python fix_manifest.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add src/data/manifest.json
          git diff --quiet && git diff --staged --quiet || git commit -m "auto: update manifest"
          git push
