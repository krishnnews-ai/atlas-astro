name: Auto Run Manifest and Category Scripts

on:
  push:
    paths:
      - 'src/content/blog/**'

permissions:
  contents: write

jobs:
  run-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Manifest and Category Scripts
        run: |
          python fix_manifest.py
          python fix_categories.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update manifest and categories after Sveltia CMS post"
